<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <svg style="display: none;">
        <symbol id="icon-downarrow" viewBox="0 0 24 24">
            <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M7,10L12,15L17,10H7Z" />
        </symbol>
    </svg>

    <svg style="display: none;">
        <symbol id="icon-uparrow" viewBox="0 0 24 24">
            <path d="M12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20M17,14L12,9L7,14H17Z" />
        </symbol>
    </svg>
    
    <svg style="display: none;">
        <symbol id="icon-trashcan-closed" viewBox="0 0 24 24">
            <path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" />
        </symbol>
    </svg>

    <svg style="display: none;">
        <symbol id="icon-trashcan-open" viewBox="0 0 24 24">
            <path d="M20.37,8.91L19.37,10.64L7.24,3.64L8.24,1.91L11.28,3.66L12.64,3.29L16.97,5.79L17.34,7.16L20.37,8.91M6,19V7H11.07L18,11V19A2,2 0 0,1 16,21H8A2,2 0 0,1 6,19Z" />
        </symbol>
    </svg>

    <svg style="display: none;">
        <symbol id="icon-trashcan-open" viewBox="0 0 24 24">
            <path d="M20.37,8.91L19.37,10.64L7.24,3.64L8.24,1.91L11.28,3.66L12.64,3.29L16.97,5.79L17.34,7.16L20.37,8.91M6,19V7H11.07L18,11V19A2,2 0 0,1 16,21H8A2,2 0 0,1 6,19Z" />
        </symbol>
    </svg>

    <svg style="display: none;">
        <symbol id="icon-pencil" viewBox="0 0 24 24">
            <path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z" />
        </symbol>
    </svg>

    <main class="all-content">

        <nav class="main-sidebar">
            <div>Something here</div>
            <div>Something else here</div>
            <div>A third thing here</div>
            <div>The final thing here</div>
        </nav>

        <section class="main-section">
            <div class="main-content">
                <form id="to-do-form" style="display: none;">
                    <div>
                        <label for="title"> Enter title:</label>
                        <input type="text" name="title" id="title" required />
                    </div>
                    <div>
                        <label for="due-date">Enter due-date:</label>
                        <input type="date" name="dueDate" id="due-date" required/>
                    </div>
                    <div>
                        <label for="description">Enter desc:</label>
                        <input type="text" name="description" id="description"/>
                    </div>
                    <div>
                        <fieldset>
                            <legend>Priority</legend>

                            <label>
                                <input type="radio" name="priority" value="High"/>
                                High
                            </label>
                            
                            <label>
                                <input type="radio" name="priority" value="Medium"/>
                                Medium
                            </label>

                            <label>
                                <input type="radio" name="priority" value="Low"/>
                                Low
                            </label>

                        </fieldset>
                    </div>
                    <div>
                        <label for="checklist">Enter checklist items:</label>
                        <input type="text" name="checklist" id="checklist"/>
                    </div>
                    <div>
                        <input type="submit" value="Enter">
                    </div>
                </form>
            </div>
            
            <footer class="footer-nav">
                <div>
                    <button type="button" class="new-to-do">Add To-Do item</button>
                </div>
                <div>Search for a to-do</div>
            </footer>

        </section>
    </main>
</body>
</html>
